name: Deploy to GitHub Pages

on:
  # Deploy only after the CI workflow succeeds on master, so only validated
  # changes reach production.
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]
  # Allow a manual redeploy from the Actions tab (emergency redeploy,
  # independent of CI).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let a newer commit finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    # For workflow_run triggers, require a successful CI run; always allow
    # manual workflow_dispatch redeploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run the same validation as CI so a manual workflow_dispatch deploy is
      # never shipped without lint/typecheck/test passing. A failure here
      # stops the deploy before the Pages artifact is uploaded.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No live API key is ever required: tests cover pure logic and prompt
      # construction only (AGENTS.md testing guidance).
      - name: Unit tests
        run: pnpm test

      - name: Build
        env:
          # A project Pages site is served from /<repo>, so the export needs a
          # matching basePath. A user/org site (<user>.github.io) serves from the
          # root and must not have one.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm build

      - name: Disable Jekyll processing
        # Without this, GitHub Pages ignores Next's _next/ directory.
        run: touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
