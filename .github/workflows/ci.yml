name: CI

on:
  push:
    branches: [master]
    # Skip CI for docs-only changes; deploy.yml is gated on CI so it skips too.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - 'examples/**'
      - '.qoder/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/**'
      - 'examples/**'
      - '.qoder/**'

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No live API key is ever required: tests cover pure logic and prompt
      # construction only (AGENTS.md testing guidance).
      - name: Unit tests
        run: pnpm test

      - name: Build (static export)
        run: pnpm build

      - name: Assert the export is fully static
        run: |
          test -f out/index.html
          test -f out/setup/index.html
          test -f out/interview/index.html
          test -f out/report/index.html
          test -f out/settings/index.html
          test -f out/privacy/index.html
          test -f out/pdf.worker.min.mjs
          echo "Static export verified."

      - name: Assert no API keys were committed or bundled
        run: |
          # Hard constraint #2: no key may appear in the repo or the bundle.
          # Shapes covered (README BYOK table): OpenAI (sk-...), OpenRouter
          # (sk-or-v1-...), Groq (gsk_...), plus a long-token heuristic for
          # arbitrary keys of local OpenAI-compatible endpoints (Ollama /
          # LM Studio).
          KEY_PREFIXES='sk-[A-Za-z0-9_-]{20,}|sk-or-v1-[A-Za-z0-9_-]{30,}|gsk_[A-Za-z0-9_-]{20,}'
          LONG_TOKEN='[A-Za-z0-9_-]{48,}'
          if grep -rEn "$KEY_PREFIXES" out/ app/ lib/ components/ hooks/ 2>/dev/null; then
            echo "::error::A string resembling an API key was found."
            exit 1
          fi
          # Long-token heuristic on sources only: the build output embeds
          # legitimately long base64 runs (fonts, the pdf.js WASM worker).
          # Legitimate long tokens (e.g. the LPDP article URL slug) are
          # allowlisted here.
          ALLOWED_LONG_TOKENS='ini-yang-perlu-disiapkan-untuk-hadapi-seleksi-substansi-lpdp'
          if grep -rEoh "$LONG_TOKEN" app/ lib/ components/ hooks/ 2>/dev/null \
              | grep -Ev "^($ALLOWED_LONG_TOKENS)$"; then
            echo "::error::A long token resembling an API key was found."
            exit 1
          fi
          echo "No API key patterns found."
